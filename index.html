<!DOCTYPE html>
<html lang="en">
<link rel="icon" type="image/x-icon" href="snake.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --safe-margin: 10px;
            --safe-margin-tb: 18px;
            --game-size: 300px;
            --dpad-btn: 60px;
            --neon: #4ecca3;
            --neon2: #e94560;
            --bg: #1a1a2e;
            --panel: #16213e;
            --deep: #0f3460;
        }

        html, body { width: 100%; height: 100%; }

        body {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            max-height: 100dvh;
            font-family: 'Courier New', monospace;
            color: #eee;
            overflow: hidden;
            padding: var(--safe-margin-tb) var(--safe-margin);
            gap: 0;
        }

        /* ── HOME DASHBOARD ───────────────────────── */
        #homeDashboard {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            gap: 0;
            overflow-y: auto;
        }

        #homeDashboard.hidden { display: none !important; }

        .dash-logo {
            font-size: clamp(22px, 6vw, 38px);
            font-weight: bold;
            letter-spacing: 6px;
            color: var(--neon);
            text-shadow: 0 0 20px rgba(78,204,163,0.5);
            margin-bottom: 4px;
        }

        .dash-tagline {
            font-size: clamp(8px, 1.8vw, 11px);
            color: #555;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* Stats row */
        .dash-stats {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
            max-width: 380px;
        }

        .stat-card {
            flex: 1;
            background: var(--panel);
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 10px 8px;
            text-align: center;
        }

        .stat-card .stat-label {
            font-size: clamp(7px, 1.4vw, 9px);
            color: #556;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-card .stat-val {
            font-size: clamp(16px, 4vw, 24px);
            font-weight: bold;
            color: var(--neon);
        }

        .stat-card .stat-val.red { color: var(--neon2); }
        .stat-card .stat-val.gold { color: #ffd700; }

        /* Difficulty selector */
        .dash-section-label {
            font-size: clamp(7px, 1.4vw, 9px);
            color: #556;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            width: 100%;
            max-width: 380px;
            text-align: left;
        }

        .dash-diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 16px;
        }

        .dash-diff-btn {
            background: var(--panel);
            border: 2px solid #1e3a5f;
            border-radius: 10px;
            color: #aaa;
            font-family: inherit;
            font-size: clamp(9px, 2vw, 12px);
            font-weight: bold;
            letter-spacing: 1px;
            padding: 10px 6px;
            cursor: pointer;
            transition: all 0.18s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .dash-diff-btn .diff-speed {
            font-size: clamp(7px, 1.2vw, 9px);
            font-weight: normal;
            color: #445;
            letter-spacing: 0;
        }

        .dash-diff-btn:hover {
            border-color: var(--neon);
            color: var(--neon);
        }

        .dash-diff-btn.active {
            border-color: var(--neon);
            color: var(--bg);
            background: var(--neon);
        }

        .dash-diff-btn.active .diff-speed { color: #0f4030; }

        /* Play button */
        .dash-play-btn {
            width: 100%;
            max-width: 380px;
            padding: 14px 0;
            background: var(--neon2);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: clamp(13px, 3vw, 17px);
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-bottom: 10px;
        }

        .dash-play-btn:hover { background: #ff6b6b; transform: scale(1.02); }
        .dash-play-btn:active { transform: scale(0.97); }

        /* Controls hint */
        .dash-controls {
            display: flex;
            gap: 16px;
            color: #445;
            font-size: clamp(7px, 1.3vw, 9px);
            letter-spacing: 1px;
        }

        /* ── GAME OVER SCREEN ─────────────────────── */
        #gameOverScreen {
            position: fixed;
            inset: 0;
            background: rgba(10,10,20,0.96);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 20px;
        }

        #gameOverScreen.hidden { display: none !important; }

        .go-title {
            font-size: clamp(24px, 7vw, 42px);
            color: var(--neon2);
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 24px rgba(233,69,96,0.6);
            margin-bottom: 6px;
        }

        .go-score-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .go-stat {
            text-align: center;
        }

        .go-stat .go-label {
            font-size: clamp(7px, 1.4vw, 10px);
            color: #556;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .go-stat .go-val {
            font-size: clamp(20px, 5vw, 32px);
            font-weight: bold;
            color: var(--neon);
        }

        .go-stat .go-val.gold { color: #ffd700; }

        .go-new-best {
            font-size: clamp(8px, 1.8vw, 11px);
            color: #ffd700;
            letter-spacing: 2px;
            margin-bottom: 12px;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .go-new-best.show { opacity: 1; }

        .go-diff-badge {
            font-size: clamp(7px, 1.4vw, 10px);
            color: var(--bg);
            background: var(--neon);
            border-radius: 6px;
            padding: 2px 10px;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .go-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }

        .go-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(10px, 2.2vw, 13px);
            letter-spacing: 2px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, background 0.18s;
        }

        .go-btn:active { transform: scale(0.95); }

        .go-btn.play-again {
            background: var(--neon2);
            color: #fff;
            border-color: var(--neon2);
        }

        .go-btn.play-again:hover { background: #ff6b6b; }

        .go-btn.go-home {
            background: transparent;
            color: #aaa;
            border-color: #2a3a5a;
        }

        .go-btn.go-home:hover { background: var(--panel); color: #eee; }

        /* ── UI Panel ─────────────────────────────── */
        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: var(--game-size);
            flex-shrink: 0;
            margin-bottom: 6px;
        }

        .score-box {
            background: var(--panel);
            padding: 4px 10px;
            border-radius: 8px;
            border: 2px solid var(--neon2);
            font-size: clamp(9px, 2vw, 14px);
            font-weight: bold;
            white-space: nowrap;
        }

        .score-box span { color: var(--neon2); }

        /* Menu Button */
        .menu-btn {
            background: var(--panel);
            color: var(--neon);
            border: 2px solid var(--neon);
            padding: 5px 14px;
            font-size: clamp(9px, 1.8vw, 13px);
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s, color 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .menu-btn:hover { background: var(--neon); color: var(--bg); transform: scale(1.05); }
        .menu-btn:active { transform: scale(0.95); }

        .menu-btn .hamburger { display: flex; flex-direction: column; gap: 3px; }
        .menu-btn .hamburger span { display: block; width: 14px; height: 2px; background: currentColor; border-radius: 2px; }

        /* Game container */
        .game-container {
            position: relative;
            border: 3px solid var(--panel);
            border-radius: 8px;
            background: var(--deep);
            padding: 5px;
            flex-shrink: 0;
            width: var(--game-size);
            height: var(--game-size);
        }

        #gameCanvas {
            display: block;
            background: var(--bg);
            border-radius: 4px;
            width: 100%;
            height: 100%;
        }

        /* Controls info */
        .controls-info {
            color: #666;
            font-size: clamp(9px, 1.4vw, 12px);
            text-align: center;
            flex-shrink: 0;
            margin-top: 4px;
        }

        /* D-pad */
        .mobile-controls {
            display: none;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            user-select: none;
            margin-top: 6px;
            gap: 0;
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: flex; }
            .controls-info   { display: none; }
        }

        @media (max-width: 900px) {
            .mobile-controls { display: flex; }
            .controls-info   { display: none; }
        }

        @media (min-width: 901px) and (hover: hover) and (pointer: fine) {
            .mobile-controls { display: none !important; }
            .controls-info   { display: block !important; }
        }

        .d-pad-row { display: flex; align-items: center; }

        .d-pad-spacer { width: var(--dpad-btn); height: var(--dpad-btn); }

        .d-pad-btn {
            width: var(--dpad-btn);
            height: var(--dpad-btn);
            background: var(--panel);
            border: 2px solid var(--neon);
            color: var(--neon);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: background 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            margin: 3px;
        }

        .d-pad-btn svg {
            width: 55%; height: 55%;
            stroke: currentColor; fill: none;
            stroke-width: 3;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .d-pad-btn:active, .d-pad-btn.pressed {
            background: var(--neon); color: var(--bg); transform: scale(0.9);
        }

        /* Menu Popup */
        .menu-popup-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn  { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .menu-popup {
            background: var(--deep);
            border: 2px solid var(--neon);
            border-radius: 14px;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            min-width: 200px;
            box-shadow: 0 0 40px rgba(78,204,163,0.2);
            animation: popIn 0.18s cubic-bezier(.34,1.56,.64,1);
        }

        .menu-popup h3 {
            color: var(--neon);
            font-size: clamp(14px, 3.5vw, 20px);
            letter-spacing: 3px;
            text-transform: uppercase;
            border-bottom: 1px solid #1e3a5f;
            width: 100%;
            text-align: center;
            padding-bottom: 10px;
        }

        .menu-popup-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }

        .popup-btn {
            width: 100%;
            padding: 10px 0;
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(11px, 2.5vw, 15px);
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, background 0.2s, color 0.2s;
            letter-spacing: 1px;
        }

        .popup-btn:active { transform: scale(0.95); }
        .popup-btn.resume  { background: var(--neon); color: var(--bg); border-color: var(--neon); }
        .popup-btn.resume:hover { background: #6eefc0; }
        .popup-btn.restart { background: transparent; color: var(--neon2); border-color: var(--neon2); }
        .popup-btn.restart:hover { background: var(--neon2); color: #fff; }
        .popup-btn.home    { background: transparent; color: #aaa; border-color: #2a3a5a; }
        .popup-btn.home:hover { background: var(--panel); color: #eee; border-color: #888; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- ══ HOME DASHBOARD ══════════════════════════════════════════ -->
<div id="homeDashboard">
    <div class="dash-logo">SNAKE</div>
    <div class="dash-tagline">arcade edition</div>

    <!-- Stats -->
    <div class="dash-stats">
        <div class="stat-card">
            <div class="stat-label">Best Score</div>
            <div class="stat-val gold" id="dashHighScore">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Games</div>
            <div class="stat-val" id="dashGames">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Last Score</div>
            <div class="stat-val red" id="dashLastScore">—</div>
        </div>
    </div>

    <!-- Difficulty -->
    <div class="dash-section-label">Select Difficulty</div>
    <div class="dash-diff-grid">
        <button class="dash-diff-btn active" onclick="dashSetDiff('easy')"    id="ddEasy">
            EASY<span class="diff-speed">Relaxed pace</span>
        </button>
        <button class="dash-diff-btn"        onclick="dashSetDiff('medium')"  id="ddMedium">
            MEDIUM<span class="diff-speed">Standard</span>
        </button>
        <button class="dash-diff-btn"        onclick="dashSetDiff('hard')"    id="ddHard">
            HARD<span class="diff-speed">Fast</span>
        </button>
        <button class="dash-diff-btn"        onclick="dashSetDiff('veryhard')" id="ddVeryhard">
            VERY HARD<span class="diff-speed">Insane</span>
        </button>
    </div>

    <!-- Play -->
    <button class="dash-play-btn" onclick="startGameFromDash()">▶ &nbsp;PLAY</button>

    <!-- Controls hint -->
    <div class="dash-controls">
        <span>↑↓←→ WASD</span>
        <span>SPACE pause</span>
        <span>M menu</span>
    </div>
</div>

<!-- ══ GAME OVER SCREEN ════════════════════════════════════════ -->
<div id="gameOverScreen" class="hidden">
    <div class="go-title">GAME OVER</div>
    <div class="go-score-row">
        <div class="go-stat">
            <div class="go-label">Score</div>
            <div class="go-val" id="goScore">0</div>
        </div>
        <div class="go-stat">
            <div class="go-label">Best</div>
            <div class="go-val gold" id="goBest">0</div>
        </div>
    </div>
    <div class="go-new-best" id="goNewBest">★ NEW BEST ★</div>
    <div class="go-diff-badge" id="goDiffBadge">EASY</div>
    <div class="go-actions">
        <button class="go-btn play-again" onclick="startGameFromDash()">↺ RETRY</button>
        <button class="go-btn go-home"    onclick="showHome()">⌂ HOME</button>
    </div>
</div>

<!-- ══ GAME UI ═════════════════════════════════════════════════ -->
<div class="ui-panel">
    <div class="score-box">SCORE: <span id="score">0</span></div>
    <button class="menu-btn" id="menuTopBtn" onclick="openMenu()">
        <span class="hamburger"><span></span><span></span><span></span></span>
        MENU
    </button>
    <div class="score-box">HIGH: <span id="highScore">0</span></div>
</div>

<div class="game-container">
    <canvas id="gameCanvas"></canvas>
</div>

<div class="controls-info">Arrow Keys or WASD &bull; Space to pause &bull; M for menu</div>

<div class="mobile-controls" id="dpad">
    <div class="d-pad-row">
        <div class="d-pad-spacer"></div>
        <button class="d-pad-btn" id="btn-up" aria-label="Up"
            ontouchstart="dpadPress(event,'up')" ontouchend="dpadRelease('up')"
            onmousedown="dpadPress(event,'up')" onmouseup="dpadRelease('up')">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
        <div class="d-pad-spacer"></div>
    </div>
    <div class="d-pad-row">
        <button class="d-pad-btn" id="btn-left" aria-label="Left"
            ontouchstart="dpadPress(event,'left')" ontouchend="dpadRelease('left')"
            onmousedown="dpadPress(event,'left')" onmouseup="dpadRelease('left')">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="d-pad-spacer"></div>
        <button class="d-pad-btn" id="btn-right" aria-label="Right"
            ontouchstart="dpadPress(event,'right')" ontouchend="dpadRelease('right')"
            onmousedown="dpadPress(event,'right')" onmouseup="dpadRelease('right')">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
    </div>
    <div class="d-pad-row">
        <div class="d-pad-spacer"></div>
        <button class="d-pad-btn" id="btn-down" aria-label="Down"
            ontouchstart="dpadPress(event,'down')" ontouchend="dpadRelease('down')"
            onmousedown="dpadPress(event,'down')" onmouseup="dpadRelease('down')">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="d-pad-spacer"></div>
    </div>
</div>

<!-- Menu Popup -->
<div class="menu-popup-backdrop hidden" id="menuBackdrop">
    <div class="menu-popup">
        <h3>⚙ Menu</h3>
        <div class="menu-popup-actions">
            <button class="popup-btn resume"  onclick="menuResume()">▶ Resume</button>
            <button class="popup-btn restart" onclick="menuRestart()">↺ Restart</button>
            <button class="popup-btn home"    onclick="menuHome()">⌂ Home</button>
        </div>
    </div>
</div>

<script>
    const canvas   = document.getElementById('gameCanvas');
    const ctx      = canvas.getContext('2d');
    const scoreEl  = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const dpadEl   = document.getElementById('dpad');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const homeDash = document.getElementById('homeDashboard');
    const gameOverScreen = document.getElementById('gameOverScreen');

    const TILE_COUNT = 24;
    let GRID_SIZE = 12;

    const DIFFICULTIES = {
        easy:     { speed: 150, label: 'EASY' },
        medium:   { speed: 100, label: 'MEDIUM' },
        hard:     { speed: 70,  label: 'HARD' },
        veryhard: { speed: 40,  label: 'VERY HARD' }
    };

    let currentDifficulty = 'easy';
    let gameSpeed = 150;
    let snake=[], food={}, direction={x:0,y:0}, nextDirection={x:0,y:0};
    let score=0;
    let highScore    = +(localStorage.getItem('snakeHighScore') || 0);
    let totalGames   = +(localStorage.getItem('snakeTotalGames') || 0);
    let lastScore    = localStorage.getItem('snakeLastScore');
    let gameLoop=null, isRunning=false, isPaused=false, particles=[], menuOpen=false;

    const C = {
        bg:'#1a1a2e', grid:'#16213e',
        head:'#4ecca3', body:'#3cb371', outline:'#2e8b57',
        food:'#e94560', foodGlow:'#ff6b6b'
    };

    // Init dashboard display
    refreshDash();

    /* ── Dashboard helpers ───────────────────────────────────── */
    function refreshDash() {
        document.getElementById('dashHighScore').textContent = highScore;
        document.getElementById('dashGames').textContent     = totalGames;
        document.getElementById('dashLastScore').textContent = lastScore !== null ? lastScore : '—';
        highScoreEl.textContent = highScore;
    }

    function dashSetDiff(diff) {
        currentDifficulty = diff;
        gameSpeed = DIFFICULTIES[diff].speed;
        document.querySelectorAll('.dash-diff-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('dd' + diff.charAt(0).toUpperCase() + diff.slice(1)).classList.add('active');
    }

    function showHome() {
        gameOverScreen.classList.add('hidden');
        homeDash.classList.remove('hidden');
        refreshDash();
    }

    function startGameFromDash() {
        homeDash.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        startGame();
    }

    /* ── Responsive sizing ───────────────────────────────────── */
    function isDpadVisible() {
        return window.getComputedStyle(dpadEl).display !== 'none';
    }

    function resize() {
        const margin = 10, marginTB = 18;
        const vw = window.innerWidth, vh = window.innerHeight;
        const uiH = 42, hintH = isDpadVisible() ? 0 : 24;
        const dpadEstimate = isDpadVisible() ? 210 : 0;
        const availH = vh - marginTB*2 - uiH - hintH - dpadEstimate - 20;
        const availW = vw - margin*2;
        const raw  = Math.min(availW, availH);
        const size = Math.max(96, Math.floor(raw / TILE_COUNT) * TILE_COUNT);
        GRID_SIZE  = size / TILE_COUNT;
        document.documentElement.style.setProperty('--game-size', size + 'px');
        canvas.width = size; canvas.height = size;
        const btnSize = Math.min(Math.max(Math.floor((size - margin*2) / 3), 44), 80);
        document.documentElement.style.setProperty('--dpad-btn', btnSize + 'px');
        draw();
    }

    window.addEventListener('resize', resize);
    requestAnimationFrame(() => requestAnimationFrame(resize));

    /* ── Game logic ──────────────────────────────────────────── */
    function initGame() {
        const s = Math.floor(TILE_COUNT / 2);
        snake = [{x:s,y:s},{x:s-1,y:s},{x:s-2,y:s}];
        direction = {x:1,y:0}; nextDirection = {x:1,y:0};
        score = 0; scoreEl.textContent = 0; particles = [];
        spawnFood();
    }

    function spawnFood() {
        let ok = false;
        while (!ok) {
            food = { x:Math.floor(Math.random()*TILE_COUNT), y:Math.floor(Math.random()*TILE_COUNT) };
            ok = !snake.some(s => s.x===food.x && s.y===food.y);
        }
    }

    function update() {
        if (isPaused || menuOpen) return;
        direction = {...nextDirection};
        const head = { x:snake[0].x+direction.x, y:snake[0].y+direction.y };
        if (head.x<0||head.x>=TILE_COUNT||head.y<0||head.y>=TILE_COUNT) { gameOver(); return; }
        if (snake.some(s => s.x===head.x&&s.y===head.y))                { gameOver(); return; }
        snake.unshift(head);
        if (head.x===food.x && head.y===food.y) {
            score += 10; scoreEl.textContent = score;
            for (let i=0;i<8;i++) particles.push({
                x:food.x*GRID_SIZE+GRID_SIZE/2, y:food.y*GRID_SIZE+GRID_SIZE/2,
                vx:(Math.random()-.5)*4, vy:(Math.random()-.5)*4, life:1, color:C.food
            });
            spawnFood();
        } else { snake.pop(); }
    }

    function draw() {
        ctx.fillStyle = C.bg;
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle = C.grid; ctx.lineWidth = 0.5;
        for (let i=0;i<=TILE_COUNT;i++) {
            ctx.beginPath(); ctx.moveTo(i*GRID_SIZE,0); ctx.lineTo(i*GRID_SIZE,canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i*GRID_SIZE); ctx.lineTo(canvas.width,i*GRID_SIZE); ctx.stroke();
        }
        const fx=food.x*GRID_SIZE, fy=food.y*GRID_SIZE;
        ctx.shadowColor=C.foodGlow; ctx.shadowBlur=12;
        ctx.fillStyle=C.food;
        ctx.beginPath(); ctx.arc(fx+GRID_SIZE/2, fy+GRID_SIZE/2, GRID_SIZE/2-1, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        snake.forEach((seg,i) => {
            const x=seg.x*GRID_SIZE, y=seg.y*GRID_SIZE, isHead=i===0;
            if (isHead) { ctx.shadowColor=C.head; ctx.shadowBlur=8; }
            ctx.fillStyle = isHead ? C.head : C.body;
            const p = isHead ? 1 : 2;
            ctx.fillRect(x+p, y+p, GRID_SIZE-p*2, GRID_SIZE-p*2);
            ctx.shadowBlur=0;
            ctx.strokeStyle=C.outline; ctx.lineWidth=1;
            ctx.strokeRect(x+p, y+p, GRID_SIZE-p*2, GRID_SIZE-p*2);
            if (isHead) {
                ctx.fillStyle='#1a1a2e';
                const es=Math.max(2,GRID_SIZE*.16);
                let e1x,e1y,e2x,e2y;
                if      (direction.x===1)  {e1x=x+GRID_SIZE*.64;e1y=y+GRID_SIZE*.24;e2x=x+GRID_SIZE*.64;e2y=y+GRID_SIZE*.60;}
                else if (direction.x===-1) {e1x=x+GRID_SIZE*.20;e1y=y+GRID_SIZE*.24;e2x=x+GRID_SIZE*.20;e2y=y+GRID_SIZE*.60;}
                else if (direction.y===-1) {e1x=x+GRID_SIZE*.24;e1y=y+GRID_SIZE*.20;e2x=x+GRID_SIZE*.60;e2y=y+GRID_SIZE*.20;}
                else                       {e1x=x+GRID_SIZE*.24;e1y=y+GRID_SIZE*.64;e2x=x+GRID_SIZE*.60;e2y=y+GRID_SIZE*.64;}
                ctx.fillRect(e1x,e1y,es,es); ctx.fillRect(e2x,e2y,es,es);
            }
        });
        particles = particles.filter(p=>p.life>0);
        particles.forEach(p => {
            ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
            ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
            p.x+=p.vx; p.y+=p.vy; p.life-=0.05;
        });
        ctx.globalAlpha=1;
        if (isPaused && !menuOpen) {
            ctx.fillStyle='rgba(0,0,0,0.5)';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='#fff';
            ctx.font=`bold ${Math.max(16,GRID_SIZE*1.4)}px Courier New`;
            ctx.textAlign='center';
            ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
            ctx.textAlign='left';
        }
    }

    function startGame() {
        if (gameLoop) clearInterval(gameLoop);
        initGame(); isRunning=true; isPaused=false; menuOpen=false;
        menuBackdrop.classList.add('hidden');
        gameLoop = setInterval(() => { update(); draw(); }, gameSpeed);
    }

    function gameOver() {
        isRunning=false; clearInterval(gameLoop);
        const isNewBest = score > highScore;
        if (isNewBest) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.textContent = highScore;
        }
        totalGames++;
        lastScore = score;
        localStorage.setItem('snakeTotalGames', totalGames);
        localStorage.setItem('snakeLastScore', lastScore);
        menuBackdrop.classList.add('hidden');
        menuOpen = false;

        // Show game over screen
        document.getElementById('goScore').textContent = score;
        document.getElementById('goBest').textContent  = highScore;
        document.getElementById('goDiffBadge').textContent = DIFFICULTIES[currentDifficulty].label;
        const nb = document.getElementById('goNewBest');
        nb.classList.toggle('show', isNewBest);
        gameOverScreen.classList.remove('hidden');
    }

    function togglePause() {
        if (!isRunning || menuOpen) return;
        isPaused = !isPaused; draw();
    }

    /* ── Menu popup ──────────────────────────────────────────── */
    function openMenu() {
        if (!isRunning) return;
        if (!isPaused) { isPaused = true; draw(); }
        menuOpen = true;
        menuBackdrop.classList.remove('hidden');
    }

    function closeMenu() { menuBackdrop.classList.add('hidden'); menuOpen = false; }

    function menuResume()  { closeMenu(); isPaused = false; draw(); }
    function menuRestart() { closeMenu(); startGame(); }
    function menuHome()    { closeMenu(); if (gameLoop) clearInterval(gameLoop); isRunning=false; isPaused=false; showHome(); }

    menuBackdrop.addEventListener('click', e => { if (e.target === menuBackdrop) menuResume(); });

    /* ── Keyboard ────────────────────────────────────────────── */
    document.addEventListener('keydown', e => {
        if (e.key==='m'||e.key==='M') { e.preventDefault(); if (isRunning) { menuOpen ? menuResume() : openMenu(); } return; }
        if (e.key==='Escape') { e.preventDefault(); if (menuOpen) { menuResume(); } else { togglePause(); } return; }
        if (e.key===' ') { e.preventDefault(); if (!isRunning) return; togglePause(); return; }
        if (!isRunning||isPaused||menuOpen) return;
        const k=e.key.toLowerCase();
        if ((k==='arrowup'   ||k==='w')&&direction.y!==1)  nextDirection={x:0,y:-1};
        if ((k==='arrowdown' ||k==='s')&&direction.y!==-1) nextDirection={x:0,y:1};
        if ((k==='arrowleft' ||k==='a')&&direction.x!==1)  nextDirection={x:-1,y:0};
        if ((k==='arrowright'||k==='d')&&direction.x!==-1) nextDirection={x:1,y:0};
    });

    /* ── D-pad ───────────────────────────────────────────────── */
    function dpadPress(e, dir) {
        e.preventDefault();
        document.getElementById('btn-'+dir)?.classList.add('pressed');
        if (!isRunning) { startGameFromDash(); return; }
        if (menuOpen) return;
        if (isPaused) { togglePause(); return; }
        if (dir==='up'   &&direction.y!==1)  nextDirection={x:0,y:-1};
        if (dir==='down' &&direction.y!==-1) nextDirection={x:0,y:1};
        if (dir==='left' &&direction.x!==1)  nextDirection={x:-1,y:0};
        if (dir==='right'&&direction.x!==-1) nextDirection={x:1,y:0};
    }

    function dpadRelease(dir) {
        document.getElementById('btn-'+dir)?.classList.remove('pressed');
    }
</script>
</body>
</html>
